<svg width="1000" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C27B0" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2196F3" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F44336" />
      <stop offset="100%" stop-color="#F87171" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-20%" width="125%" height="150%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="280" rx="16" fill="url(#bgGrad)" />
  <rect width="998" height="278" x="1" y="1" rx="15" fill="none" stroke="#312E81" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Ambient Glow Behind Cards -->
  <circle cx="820" cy="140" r="110" fill="#6366F1" opacity="0.18" filter="url(#glow)" />
  <circle cx="160" cy="80" r="90" fill="#9333EA" opacity="0.12" filter="url(#glow)" />

  <!-- Left: Branding & Value Prop -->
  <g transform="translate(60, 48)">
    <!-- App Badge Pill -->
    <rect width="144" height="26" rx="13" fill="#312E81" fill-opacity="0.8" stroke="#6366F1" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#A855F7" />
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#E0E7FF" letter-spacing="0.5">WINDOWS DESKTOP</text>

    <!-- Main Title -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">KanbanCards</text>

    <!-- Tagline -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#C7D2FE">Notes that live on the edge.</text>

    <!-- Description -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">Collapsed into an unobtrusive bezel staircase. Fluid hover expansion.</text>
    <text x="0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">Hardware-accelerated WPF, SQLite WAL persistence, zero distractions.</text>

    <!-- Tech Stack Mini Pills -->
    <g transform="translate(0, 182)">
      <rect x="0" y="0" width="70" height="22" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="35" y="15" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#38BDF8">.NET 8</text>

      <rect x="78" y="0" width="60" height="22" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="108" y="15" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#C084FC">WPF</text>

      <rect x="146" y="0" width="90" height="22" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="191" y="15" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#34D399">SQLite WAL</text>

      <rect x="244" y="0" width="82" height="22" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="285" y="15" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#FBBF24">Win 10/11</text>
    </g>
  </g>

  <!-- Right: Stylized Staircase Stack Illustration -->
  <g transform="translate(640, 28)">
    <!-- Bezel Edge Indicator Line -->
    <line x1="318" y1="0" x2="318" y2="224" stroke="#4F46E5" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4" />
    <text x="314" y="238" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#6366F1" font-weight="600">SCREEN BEZEL</text>

    <!-- Card 1 (Lavender - Top) -->
    <g filter="url(#cardShadow)">
      <rect x="110" y="12" width="208" height="34" rx="8" fill="#F3E5F5" />
      <rect x="110" y="12" width="6" height="34" rx="2" fill="url(#cardGrad1)" />
      <text x="126" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Netpilot Core Specs</text>
    </g>

    <!-- Card 2 (Soft Sky) -->
    <g filter="url(#cardShadow)">
      <rect x="70" y="52" width="248" height="34" rx="8" fill="#E5F3FF" />
      <rect x="70" y="52" width="6" height="34" rx="2" fill="url(#cardGrad2)" />
      <text x="86" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Socket Programming Lab</text>
    </g>

    <!-- Card 3 (Mint Green) -->
    <g filter="url(#cardShadow)">
      <rect x="40" y="92" width="278" height="34" rx="8" fill="#E8F5E9" />
      <rect x="40" y="92" width="6" height="34" rx="2" fill="url(#cardGrad3)" />
      <text x="56" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#1E293B">GSD Sprint Deliverables</text>
    </g>

    <!-- Card 4 (Warm Peach) -->
    <g filter="url(#cardShadow)">
      <rect x="90" y="132" width="228" height="34" rx="8" fill="#FFF3E0" />
      <rect x="90" y="132" width="6" height="34" rx="2" fill="url(#cardGrad4)" />
      <text x="106" y="154" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#1E293B">REA Reverse Engineering</text>
    </g>

    <!-- Card 5 (Blush Red) -->
    <g filter="url(#cardShadow)">
      <rect x="120" y="172" width="198" height="34" rx="8" fill="#FFEBEE" />
      <rect x="120" y="172" width="6" height="34" rx="2" fill="url(#cardGrad5)" />
      <text x="136" y="194" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Honor Roll GPA</text>
    </g>
  </g>
</svg>
